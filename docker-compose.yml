version: "3.8"

services:
  cybershield:
    build: .
    container_name: cybershield-x
    ports:
      - "8000:8000"
    environment:
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - PROXY_URL=${PROXY_URL:-}
    volumes:
      - ./cybershield/data:/app/cybershield/data
      - ./scope.yaml:/app/scope.yaml
    restart: unless-stopped
