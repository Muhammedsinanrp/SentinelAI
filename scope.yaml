program: "CyberShield Enterprise Live Sandbox"
in_scope:
  - "httpbin.org"
  - "*.httpbin.org"
  - "example.com"
  - "*.example.com"
out_of_scope:
  - "status.example.com"
  - "payment.example.com"
rate_limit:
  requests_per_second: 2
  burst: 5
ai:
  provider: "openai"
  model: "gpt-4o-mini"
  max_tokens: 1500
